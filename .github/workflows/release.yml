name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          if ! cargo metadata --no-deps --format-version 1 --locked |
            jq -e --arg expected "$tag_version" \
              '(.packages | length > 0) and all(.packages[]; .version == $expected)' \
              > /dev/null; then
            echo "::error::Release tag '$RELEASE_TAG' does not match the Cargo workspace package version."
            exit 1
          fi

  package:
    name: Package ${{ matrix.name }}
    needs: validate
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            archive: markoff-windows-x86_64.zip
          - os: ubuntu-latest
            name: linux-x86_64
            archive: markoff-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binaries
        run: cargo build --release -p markoff_cli -p markoff_gui
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/markoff_cli.exe,target/release/markoff_gui.exe -DestinationPath ${{ matrix.archive }}
      - name: Package Linux binaries
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.archive }} -C target/release markoff_cli markoff_gui
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
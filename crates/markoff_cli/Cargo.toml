[package]
name = "markoff_cli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "CLI for markoff"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
glob = "0.3"
markoff_core = { path = "../markoff_core" }
markoff_gui = { path = "../markoff_gui" }
indicatif = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
vergen-gitcl = { version = "10", features = ["build", "cargo", "rustc"] }

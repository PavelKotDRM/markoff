[package]
name = "markoff_gui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "GUI for markoff"
publish = false

[dependencies]
anyhow = "1.0"
egui = "0.36"
egui_commonmark = "0.25.0"
egui_extras = "0.36"
markoff_core = { path = "../markoff_core" }
rfd = "0.15"
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }

[target.'cfg(not(any(target_os = "windows", target_os = "linux")))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }

[build-dependencies]
vergen-gitcl = { version = "10", features = ["build", "cargo", "rustc"] }

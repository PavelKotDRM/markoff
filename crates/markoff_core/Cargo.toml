[package]
name = "markoff_core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core conversion engine for markoff"
publish = false

[features]
ocr-cuda = ["oar-ocr/cuda", "oar-ocr-vl/cuda"]
ocr-directml = ["oar-ocr/directml"]
ocr-coreml = ["oar-ocr/coreml"]
ocr-metal = ["oar-ocr-vl/metal"]

[dependencies]
anyhow = "1"
base64 = "0.23"
calamine = "0.38"
csv = "1"
dejavu = "2.37"
epaint_default_fonts = "0.37"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
lopdf = "0.47"
office_oxide = "0.1"
oar-ocr = { version = "0.11", default-features = false, features = ["auto-download", "simd"] }
oar-ocr-core = { version = "0.11", default-features = false }
oar-ocr-vl = { version = "0.11", features = ["auto-download"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }
pdfium-render = "0.9"
png = "0.18"
pulldown-cmark = "0.13"
quick-xml = "0.42"
rust_xlsxwriter = "0.104"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
skrifa = "0.50"
thiserror = "2.0"
toml = "1"
tracing = "0.1"
twemoji-assets = { version = "1.5", default-features = false, features = ["png"] }
unicode-bidi = "0.3"
unicode-segmentation = "1"
ureq = { version = "3", features = ["json"] }
zip = "9"

[build-dependencies]
flate2 = "1"
sha2 = "0.11"
tar = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
criterion = "0.8"
proptest = "1"

[[bench]]
name = "conversion"
harness = false

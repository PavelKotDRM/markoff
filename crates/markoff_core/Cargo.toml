[package]
name = "markoff_core"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Core conversion engine for markoff"
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.23"
calamine = "0.36"
csv = "1.0"
dejavu = "2.37"
epaint_default_fonts = "0.36.2"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
lopdf = "0.45"
pdfium-bundled = { version = "0.2", features = ["bundled"] }
png = "0.18"
pulldown-cmark = "0.13"
quick-xml = "0.42"
rust_xlsxwriter = "0.99"
same-file = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
toml = "1"
tracing = "0.1"
ttf-parser = "0.25"
twemoji-assets = { version = "1.5.1", default-features = false, features = ["png"] }
unicode-bidi = "0.3"
unicode-segmentation = "1.12"
zip = "8"

[dev-dependencies]
criterion = "0.8"
proptest = "1.1.0"

[[bench]]
name = "conversion"
harness = false

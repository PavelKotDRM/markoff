[package]
name = "markoff_core"
version.workspace = true
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Core conversion engine for markoff"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23"
calamine = "0.38"
csv = "1"
dejavu = "2.37"
epaint_default_fonts = "0.37"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
lopdf = "0.47"
office_oxide = "0.1"
pdfium-bundled = { version = "0.2", features = ["bundled"] }
# pdfium-bundled ships PDFium 8066; pdfium-render 0.9.5 requires API 8125.
pdfium-render = "=0.9.4"
png = "0.18"
pulldown-cmark = "0.13"
quick-xml = "0.42"
rust_xlsxwriter = "0.102"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
skrifa = "0.49"
thiserror = "2.0"
toml = "1"
tracing = "0.1"
twemoji-assets = { version = "1.5", default-features = false, features = ["png"] }
unicode-bidi = "0.3"
unicode-segmentation = "1"
zip = "9"

[dev-dependencies]
criterion = "0.8"
proptest = "1"

[[bench]]
name = "conversion"
harness = false

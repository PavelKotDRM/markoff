[package]
name = "markoff_core"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Core conversion engine for markoff"
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.23"
calamine = "0.36"
csv = "1.0"
lopdf = "0.45"
pdfium-bundled = { version = "0.1", features = ["bundled"] }
png = "0.18"
pulldown-cmark = "0.13"
quick-xml = "0.42"
rust_xlsxwriter = "0.99"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
toml = "1"
tracing = "0.1"
zip = "8"

[dev-dependencies]
criterion = "0.8"
proptest = "1.1.0"

[[bench]]
name = "conversion"
harness = false
